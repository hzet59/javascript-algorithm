<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>포켓몬</title>
  </head>
  <body>
    <script>
      // N/2마리의 폰켓몬을 선택하는 방법 중, 가장 많은 종류의 폰켓몬을 선택하는 방법을 찾아, 그때의 폰켓몬 종류 번호의 개수를 return 하도록 solution 함수를 완성
      function solution(nums) {
        const size = nums.length / 2
        const result = nums.reduce((pre,cur) => {
          const findNum = pre.find((num)=> num == cur)
          if(!findNum) {
            pre.push(cur)
          }
          return pre
        },[])
        return result.length > size ? size : result.length
      }
      // 방법2
      function solution2(nums) {
        const max = nums.length / 2;
        const arr = [...new Set(nums)];

        return arr.length > max ? max : arr.length
      }
      console.log(solution([3, 1, 2, 3]));
    </script>
  </body>
</html>
